<!DOCTYPE html><html><head><style>body{margin:0;background:#222;color:white;font:12px monospace}#info{position:absolute;top:10px;left:10px}button{padding:12px}</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body><div id="info"><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><pre id="data"></pre></div><script type="module">
import * as T from 'three';import {GLTFLoader} from '../vendor/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#424c53');const cam=new T.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(devicePixelRatio);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;document.body.append(r.domElement);
scene.add(new T.HemisphereLight(0xe8f4ff,0x766453,2));const key=new T.DirectionalLight(0xffeddc,3);key.position.set(2,4,4);scene.add(key);const fill=new T.DirectionalLight(0xc6e2ff,2);fill.position.set(-3,2,-2);scene.add(fill);
new GLTFLoader().load('../models/ronin.glb',g=>{const root=g.scene;scene.add(root);root.updateMatrixWorld(true);const box=new T.Box3().setFromObject(root);const size=box.getSize(new T.Vector3()),ctr=box.getCenter(new T.Vector3());root.scale.setScalar(1.8/size.y);root.position.copy(ctr).multiplyScalar(-1.8/size.y);const render=(x,z)=>{cam.position.set(x,.1,z);cam.lookAt(0,0,0);r.render(scene,cam)};document.getElementById('front').onclick=()=>render(0,3.5);document.getElementById('side').onclick=()=>render(3.5,0);document.getElementById('back').onclick=()=>render(0,-3.5);document.getElementById('data').textContent=JSON.stringify({size:size.toArray(),center:ctr.toArray(),meshes:g.scene.children.length});render(0,3.5)});
</script></body></html>
